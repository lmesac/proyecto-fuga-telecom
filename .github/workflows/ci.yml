name: CI Pipeline - Telecom Churn

on:
  push:
    branches: [ "desarrollo-inicial", "main" ]
  pull_request:
    branches: [ "desarrollo-inicial", "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install uv and dependencies
      run: |
        pip install uv
        uv sync

    - name: Run unit tests with pytest
      run: |
        uv run pytest