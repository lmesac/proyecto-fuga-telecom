
name: CI Pipeline - Telecom Churn

on:
  push:
    branches: ["desarrollo-inicial", "main"]
  pull_request:
    branches: ["desarrollo-inicial", "main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run lint and tests
        run: |
          make lint
          make test